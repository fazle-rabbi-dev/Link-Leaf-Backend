info:
  name: 🗝️ Change password
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/change-password"
  body:
    type: form-urlencoded
    data:
      - name: currentPassword
        value: "000111"
      - name: newPassword
        value: "0001112"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
